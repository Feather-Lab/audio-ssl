data:
  root: '/mnt/ceph/users/jfeather/data/training_datasets_audio/JSIN_all_v3/subsets/'
  target_keys: ['signal/word_int', 'noise/labels_binary_via_int']

audio_rep:                                  # Attributes of audio feature
  name: 'cochleagram_1_1_5_secs'
  on_gpu: True

audio_transforms:
  low_snr: -10
  high_snr: 10
  rms_level: 0.02             # switch to RMS normalize - 0.02 is 60dB SPL just using for convenience 
  crop: 'CenterCropForegroundBackground'
  crop_kwrgs:
    signal_size: 40000        # signal size in frames
    crop_length: 30000        # amount to crop in frames - trying 1.5 seconds at 20kHz


val_metric:
    word_task: 'val_signal/word_int_acc'
    audioset_task: 'val_noise/labels_binary_via_int_acc'

hparas:                                   # Experiment hyper-parameters
  epochs: 10                              # Each "epoch" is 25 passes through the speech dataset
  batch_size: 768
  step_lr: 2                              # Note: this is 50 pases through the speech dataset due to the structure of the hdf5 files
  optimizer: "AdamW"
  lr: 0.001                                 # initial LR 
  valid_step: 5000
  task_loss_params:
    signal/word_int:
      loss_type: 'crossentropyloss'
      weight: 1.0
    noise/labels_binary_via_int:
      loss_type: 'bcewithlogitsloss'
      weight: 300.0

model:                                    # Model architecture
  arch_name: "resnet_multi_task50"
  arch_params:
    num_classes:
      signal/word_int: 794
      noise/labels_binary_via_int: 517
    pretrained: False