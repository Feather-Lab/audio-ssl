audio_rep:
  name: cochleagram_1
  on_gpu: true
audio_transforms:
  dbspl: 60
  high_snr: 10
  low_snr: -10
data:
  speech_h5_path: '/mnt/home/jfeather/ceph/data/training_datasets_audio/jsinV3BalancedProcessed/sr_20000/splits/train_stackedDataframeHDF_n150_VJRUH4IEPDGPNH2JZMULSQKOWYNQ6KMM.pdh5'
  noise_h5_path: '/mnt/home/jfeather/ceph/data/training_datasets_audio/audioset_dataframes/sr20000/cullLabels_silence/sr20000_unbalanced_train_segments_raw_exclude_speech_and_only_music_maxZerosPercent10.pdh5' 
  val_speech_h5_path: '/mnt/home/jfeather/ceph/data/training_datasets_audio/jsinV3BalancedProcessed/sr_20000/splits/valid_stackedDataframeHDF_n150_VJRUH4IEPDGPNH2JZMULSQKOWYNQ6KMM.pdh5'
  val_noise_h5_path: '/mnt/home/jfeather/ceph/data/training_datasets_audio/audioset_dataframes/sr20000/cullLabels_silence/sr20000_balanced_train_segments_raw_exclude_speech_and_only_music_maxZerosPercent10.pdh5' 
  dataset: MatchedSpeechInNoiseDatasetBatched
  target_keys: ['signal/word_int', 'signal/speaker_int', 'noise/labels_int']
  blocked_batches: True
  signal_augment: True


val_metric:
    word_task: 'val_signal/word_int_acc'
    speaker_task: 'val_signal/speaker_int_acc'
    audioset_task: 'val_noise/labels_int_prec'
val_metric_mode: 'max'

hparas:
  epochs: 250
  global_batch_size: 640 #320
  lambda_ssl: 1
  lr: 0.2
  num_warmup_steps_or_ratio: 0.1
  optimizer: LARS
  ssl_task: 'word'                            # either 'word', 'audioset', 'dual'
  ssl_loss_str: 'barlow'
  ssl_loss: 'Barlow_Loss'
  ssl_loss_kwargs:
    lmbda: 0.01
    out_dim: 512

  valid_step: 5000
  task_loss_params:
    signal/word_int:
      loss_type: 'crossentropyloss'
      weight: 1.0                         # init loss is ~6.6 
    noise/labels_int:
      loss_type: 'bcewithlogitsloss'
      weight: 1.0                      # init loss is ~200 
    signal/speaker_int:
      loss_type: 'crossentropyloss'
      weight: 1.0 


model:
  arch_name: "SSLBaseModelSingleTask"
  arch_kwargs:
    backbone: 'resnet18'
    in_channels: 1
    projector_dims: [512, 512]
    proj_out_dim: 512
    num_classes:
      signal/word_int: 794               # TODO: -1 from this if not using null
      signal/speaker_int: 433            # TODO: -1 from this if not using null
      noise/labels_int: 517              # Why is this 518 instead of 517? is            
    supervised: True
