audio_rep:
  name: cochleagram_1
  on_gpu: true
audio_transforms:
  dbspl: 60
  high_snr: 10
  low_snr: -10
data:
  root: /mnt/ceph/users/jfeather/data/training_datasets_audio/JSIN_all_v3/subsets/
hparas:
  epochs: 10
  global_batch_size: 768
  lambda_ssl: 1
  lr: 0.6
  lr_schedule: False
  num_warmup_steps_or_ratio: 0.1
  optimizer: LARS
  ssl_task: dual
  ssl_loss: "Paired_Loss"
  ssl_loss_str: "paired"
  ssl_loss_kwargs:
    loss_fn_inv: "Barlow_Loss"
    loss_fn_eq: "Barlow_Loss"
    loss_fn_inv_kwargs:
      lmbda: 0.005
      out_dim: 512
    loss_fn_eq_kwargs:
      lmbda: 0.005
      out_dim: 512
    lmda: 0.5
  valid_step: 5000
  sep_class_opt: True
  lr_schedule: False
model:
  arch_kwargs:
    n_classes: 794
    proj_out_dim: 2048
    projector_dims:
    - 512
    - 512
    supervised: true
  arch_name: SSLAudioModelWMetamers
