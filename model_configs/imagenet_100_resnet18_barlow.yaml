data:
  root: '/mnt/ceph/users/tyerxa/datasets/imagenet_100/'

audio_rep:                                  # Attributes of audio feature
  name: 'cochleagram_1'
  on_gpu: True


val_metric: 'val_class_acc'
val_metric_mode: 'min'

hparas:                                   # Experiment hyper-parameters
  epochs: 100                              # Each "epoch" is 25 passes through the speech dataset
  global_batch_size: 1542                  # set global batch size as init. Will be divided by n gpus and task params
  optimizer: "LARS"
  lr: 0.6                                 # initial LR 
  num_warmup_steps_or_ratio: 0.1
  lambda_ssl: 1
  valid_step: 5000
  ssl_task: 'audioset'                            # either 'word', 'audioset', 'dual'
  ssl_loss_str: 'barlow'
  ssl_loss: 'Barlow_Loss'
  ssl_loss_kwargs:
    lmbda: 0.2
    out_dim: 512

model:                                    # Model architecture
  arch_name: "SSLBaseModel"
  arch_kwargs:
    backbone: 'resnet18'
    in_channels: 3 
    projector_dims: [512, 512]
    proj_out_dim: 512
    n_classes: 100
    supervised: True
    