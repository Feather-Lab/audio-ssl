data:
  speech_h5_path: '${COCHDNN_JSIN_TRAIN_H5}'
  noise_h5_path: '${COCHDNN_AUDIONOISE_TRAIN_H5}' 
  val_speech_h5_path: '${COCHDNN_JSIN_VALID_H5}'
  val_noise_h5_path: '${COCHDNN_AUDIONOISE_VALID_H5}' 
  dataset: MatchedSpeechInNoiseDatasetBatched
  target_keys: ['signal/word_int']
  blocked_batches: True

audio_rep:                                  # Attributes of audio feature
  name: 'cochleagram_1'
  on_gpu: True

audio_transforms:
  low_snr: -10
  high_snr: 10
  dbspl: 60

val_metric:
    word_task: 'val_signal/word_int_acc'

hparas:                                   # Experiment hyper-parameters
  epochs: 100                              
  batch_size: 192                          # using Matched dataset - true global batch size is 4x this (e.g. 768 if 192)
  global_batch_size: 768                  # Use true global batch size for LARS initial LR calc 
  optimizer: "LARS"
  num_warmup_steps_or_ratio: 0.01
  lr: 0.2                                 # base LR for LARS
  valid_step: 5000
  task_loss_params:
    signal/word_int:
      loss_type: 'crossentropyloss'
      weight: 1 

model:                                    # Model architecture
  arch_name: "kell2018_multi_task"
  arch_params:
    num_classes:
      signal/word_int: 794               # TODO: -1 from this if not using null
    pretrained: False
    